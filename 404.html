<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .not-found-wrap {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .not-found-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--title);
            line-height: 1;
            margin-bottom: 10px;
        }

        .not-found-wrap h2 {
            font-size: 1.6rem;
            color: var(--text);
            margin-bottom: 12px;
        }

        .not-found-wrap p {
            color: var(--desc);
            max-width: 400px;
            margin-bottom: 24px;
        }

        .home-link {
            display: inline-block;
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--title);
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 12px;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }

        .home-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-color: var(--hover);
        }

        @media (max-width: 600px) {
            .not-found-code {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>bobg33's Projects</h1>
        <p>Lot's of projects, easy to access anywhere.</p>
    </header>

    <main class="not-found-wrap">
        <div class="not-found-code">404</div>
        <h2>Hypsilophodon spat at the servers.</h2>
        <p>The project you're looking for either doesn't exist, was renamed, or was never built in "3-5 business years".</p>
        <a class="home-link" href="index.html">Back to Projects</a>
    </main>

</body>
</html>
